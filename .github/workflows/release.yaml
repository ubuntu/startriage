name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  build:
    needs: ci
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          # setuptools-scm derives the version from the tag
          fetch-depth: 0
          persist-credentials: false
      - name: install uv
        uses: astral-sh/setup-uv@v7
        with:
          # no cache poisoning of published artifacts
          enable-cache: false

      - name: build
        run: |
          uv build
          version="${GITHUB_REF_NAME#v}"
          test -f "dist/startriage-$version.tar.gz" || { ls dist; echo "no dist for version $version"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/startriage/
    permissions:
      # trusted publishing
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
