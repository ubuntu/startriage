name: startriage
summary: Unified triage tool for Ubuntu bugs, documentation, and forum posts
description: |
  startriage is a unified triage tool for Ubuntu developer teams.
  It combines several triage sources: Launchpad, GitHub, Discourse, proposed-migration, ... into a single command.

  Run daily triage with: `startriage triage`

  For bug housekeeping: `startriage todo`

  Configuration is read from `~/snap/startriage/current/.config/startriage.toml` (snap) or `~/.config/startriage.toml` (non-snap).

  https://github.com/ubuntu/startriage

title: Startriage
contact: https://github.com/ubuntu/startriage/issues
license: GPL-3.0
donation: https://github.com/ubuntu/startriage
issues: https://github.com/ubuntu/startriage/issues
source-code: https://github.com/ubuntu/startriage
website: https://github.com/ubuntu/startriage

base: core24
type: app
version: git
confinement: strict
grade: stable

apps:
  startriage:
    command: bin/startriage
    environment:
      # The Copilot runtime defaults COPILOT_HOME to ~/.copilot, a hidden path the
      # `home` plug cannot write to. Point it at SNAP_USER_DATA, always writable.
      COPILOT_HOME: $SNAP_USER_DATA/.copilot
      # Expose staged ubuntu-dev-tools helpers (pull-lp-source, debdiff, …) on PATH
      # so the agent's shell tool can pull and diff package source.
      PATH: $SNAP/usr/bin:$SNAP/bin:$PATH
    plugs:
      - network
      - network-bind
      - home

parts:
  startriage:
    plugin: python
    source: .
    source-type: git
    # github-copilot-sdk bundles the Copilot CLI runtime binary it spawns, so no
    # separate Node part is needed; pip ships the runtime inside the snap.
    python-packages:
      - github-copilot-sdk
    stage-packages:
      # pull-lp-source / dpkg-source / debdiff for the agent's source analysis.
      - ubuntu-dev-tools
