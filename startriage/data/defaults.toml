[general]
lp_expire_level1_days = 60
lp_expire_level2_days = 180
triage_updates = "theirs"
#savebugs_dir = "~/src/ubuntu/mnt/savebugs/"
#proposed_min_age = 4
#default_team = # automatic if 1 defined
#lp_extended = # depends on mode
#lp_credentials_file = "~/.local/share/startriage/lp_creds"

[ai]
# AI-assisted triage backend (see 'startriage config set --help').
# provider and model have no default, --ai needs both.
#provider = "copilot"                             # "copilot" | "openrouter"
#model = "claude-opus-4.8"                        # the provider's model id
#github_token = "github_pat_..."                  # or COPILOT_GITHUB_TOKEN / GH_TOKEN env
#openrouter_api_key = "..."                       # or OPENROUTER_API_KEY env
#openrouter_base_url = "https://openrouter.ai/api/v1"
# Ask the model what to improve in the triage skills; the feedback goes in the
# report and in ~/.local/state/startriage/skill-feedback.jsonl.
#suggest_improvements = false

# Tools the agent may use; set with 'startriage config ai-tools'.
# A tool not listed gets its default: read tools on, fetch_url and the tools
# that run programs (fetch_source, patch_applies) off.
# grep_source and read_source_file need fetch_source.
# A phase whose tools are all off is skipped.
#[ai.tools]
#fetch_url = false
#github_search = true

[team.ubuntu-server]
lp_team = "ubuntu-server"
lp_todo_tag = "server-todo"
lp_freezer_tag = "server-freezer"
lp_ignore_packages = [
    "cloud-init",
    "curtin",
    "juju",
    "juju-core",
    "lxc",
    "lxd",
    "maas",
    "ubuntu-advantage-tools",
]
discourse_categories = [
    "project/server",
    "documentation/server-guide"
]
discourse_triage_categories = ["project/server/server-triage"]
github_repos = [
    "canonical/ubuntu-maintainers-handbook",
    {name = "canonical/ubuntu-server-documentation", todo_labels = ["For: Server ToDo"]},
    "canonical/containerd-stable",
    "canonical/containerd-app",
    "canonical/pollen",
    "canonical/runc-app",
    "canonical/runc-stable",
    "canonical/ubuntu-debuginfod-operator",
    "canonical/ubuntu-static-reports-operator",
    "canonical/git-ubuntu-operator",
]
github_todo_labels = ["server-todo"]
github_ignore_labels = ["server-triage-ignore"]
github_team = "canonical/ubuntu-server-distro"
proposed_migration_teams = ["ubuntu-server"]
