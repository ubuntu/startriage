<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<base target="_blank">
<style>
:root {
  --orange: #e95420;
  --aubergine: #772953;
  --warm-grey: #aea79f;
  --text: #111;
  --muted: #666;
  --line: #e5e5e5;
  --zebra: #f7f7f7;
  --open: #c7162b;
  --closed: #0e8420;
  --unapproved: #24598f;
  --border: 1px solid var(--warm-grey);
  --radius: 2px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  font: 15px/1.4 Ubuntu, "Ubuntu Sans", "Segoe UI", sans-serif;
  color: var(--text);
}
a { color: var(--text); }
a:hover { color: var(--orange); }
button, summary { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.btn { padding: 0.25rem 0.8rem; border: var(--border); border-radius: var(--radius); background: #fff; }
.btn:hover:enabled, .btn:hover { border-color: var(--orange); color: var(--orange); }
.btn:disabled { opacity: 0.4; cursor: default; }
.reveal { opacity: 0; }
tr:hover .reveal, .reveal:focus { opacity: 0.6; }
.reveal:hover, tr.commenting .reveal { opacity: 1; }
header {
  position: sticky;
  top: 0;
  z-index: 1;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.5rem 1rem;
  padding: 0.6rem 1.5rem;
  background: #fff;
  border-top: 4px solid var(--orange);
  border-bottom: 1px solid var(--line);
}
h1 { margin: 0; font-size: 1.3rem; font-weight: 300; }
.subtitle { color: var(--muted); }
.controls { margin-left: auto; display: flex; gap: 0.5rem; align-items: baseline; }
#left { color: var(--muted); margin-right: 0.5rem; }
.menu { position: relative; }
.menu summary { list-style: none; }
.menu summary::after { content: " \25be"; }
.menu[open] summary { border-color: var(--orange); }
.menu-items {
  position: absolute;
  right: 0;
  top: calc(100% + 2px);
  display: flex;
  flex-direction: column;
  min-width: 100%;
  background: #fff;
  border: var(--border);
  border-radius: var(--radius);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
}
.menu-items button { padding: 0.25rem 0.8rem; text-align: left; white-space: nowrap; }
.menu-items button:hover { color: var(--orange); }
main { padding: 0 1.5rem 3rem; }
h2 {
  margin: 1.8rem 0 0.4rem;
  font-size: 1.15rem;
  font-weight: 400;
  color: var(--aubergine);
}
.count {
  display: inline-block;
  min-width: 1.6em;
  padding: 0 0.4em;
  border-radius: 1em;
  background: var(--aubergine);
  color: #fff;
  font-size: 0.8rem;
  text-align: center;
  vertical-align: middle;
}
section.done h2 { color: var(--warm-grey); }
section.done .count { background: var(--warm-grey); }
section.done table { display: none; }
/* one grid for all tables, so their columns line up: each as wide as its widest cell up to a limit, the title takes the rest */
main { --column: fit-content(14rem); display: grid; grid-template-columns: repeat(8, var(--column)) minmax(0, 1fr); }
main.resizing, main.resizing * { cursor: col-resize; user-select: none; }
section, table, thead, tbody, tr { display: grid; grid-template-columns: subgrid; grid-column: 1 / -1; }
main > p, h2 { grid-column: 1 / -1; }
th {
  text-align: left;
  font-weight: 400;
  font-size: 0.8rem;
  color: var(--muted);
  border-bottom: var(--border);
  padding: 0.2rem 0.5rem;
  position: relative;
}
.resize { position: absolute; top: 0; right: 0; bottom: 0; width: 0.5rem; cursor: col-resize; touch-action: none; }
.resize:hover, main.resizing .resize:active { border-right: 2px solid var(--orange); }
button.sort { font-size: inherit; text-align: left; }
button.sort:hover { color: var(--orange); }
th[aria-sort=ascending] button.sort::after { content: " \25b4"; }
th[aria-sort=descending] button.sort::after { content: " \25be"; }
td { padding: 0.3rem 0.5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr:nth-child(even) { background: var(--zebra); }
tbody tr:hover { background: #fdf0eb; }
tbody tr { cursor: text; }
tbody a, tbody button { cursor: pointer; }
th, td:nth-child(-n+8) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
button.check {
  width: 1.5rem;
  height: 1.5rem;
  border: var(--border);
  border-radius: 50%;
  background: #fff;
  color: transparent;
  font-size: 0.9rem;
  line-height: 1;
}
button.check:hover { border-color: var(--orange); background: var(--orange); color: #fff; }
.rel { font-family: "Ubuntu Mono", monospace; font-weight: bold; color: var(--muted); }
.rel.open { color: var(--open); }
.rel.closed { color: var(--closed); }
.rel.unapproved { color: var(--unapproved); }
.title { display: flex; align-items: baseline; gap: 0.5rem; }
.title > span:first-child { flex: 1; }
.chips { display: flex; gap: 0.3rem; }
.chip {
  padding: 0 0.4rem;
  border: var(--border);
  border-radius: var(--radius);
  font-size: 0.75rem;
  color: var(--muted);
  white-space: nowrap;
}
.further, .refs { font-size: 0.8rem; color: var(--muted); }
.refs a { color: inherit; }
textarea.comment {
  display: block;
  width: 100%;
  margin-top: 0.2rem;
  padding: 0.15rem 0.3rem;
  border: 1px solid transparent;
  border-radius: var(--radius);
  background: transparent;
  font: inherit;
  font-size: 0.9rem;
  resize: none;
  overflow: hidden;
}
textarea.comment:focus { outline: none; border-color: var(--orange); background: #fff; }
button.add-comment { padding: 0 0.2rem; font-size: 0.8rem; }
button.ai-toggle {
  padding: 0 0.45rem;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  font-size: 0.75rem;
  white-space: nowrap;
  color: var(--aubergine);
  background: #fff;
}
button.ai-toggle:hover, button.ai-toggle[aria-expanded=true] {
  border-color: var(--aubergine);
  background: #f9f2f6;
}
button.ai-toggle.ai-fix { border-color: #b7d9bd; color: var(--closed); }
button.ai-toggle.ai-fix:hover, button.ai-toggle.ai-fix[aria-expanded=true] {
  border-color: var(--closed);
  background: #eef7f0;
}
button.ai-toggle.ai-muted { color: var(--muted); }
button.ai-toggle.ai-failed { border-color: #e6b8be; color: var(--open); }
td.ai-cell {
  grid-column: 2 / -1;
  padding: 0 0.5rem 0.65rem;
  border-bottom: 1px solid var(--line);
  cursor: default;
}
tr.ai-open td:not(.ai-cell) { border-bottom: 0; }
.ai-panel {
  border-left: 3px solid var(--aubergine);
  background: #fafafa;
  padding: 0.6rem 0.85rem;
  border-radius: 0 var(--radius) var(--radius) 0;
  font-size: 0.9rem;
}
.ai-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 0.3rem 1rem;
  align-items: center;
  padding-bottom: 0.45rem;
  border-bottom: 1px solid var(--line);
  font-size: 0.85rem;
}
.ai-tags { display: inline-flex; gap: 0.3rem; align-items: center; flex-wrap: wrap; }
.ai-muted { color: var(--muted); }
.ai-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 0.4rem;
  margin-top: 0.5rem;
}
.ai-action-list { display: flex; flex-wrap: wrap; gap: 0.35rem; }
.ai-action {
  padding: 0.1rem 0.5rem;
  border-radius: var(--radius);
  font-size: 0.8rem;
  border: 1px solid var(--line);
  background: #fff;
}
.ai-action-ready { border-color: #8cc596; color: var(--closed); background: #f2faf3; }
.ai-action-review { border-color: #d6b6c8; color: var(--aubergine); background: #fcf7fa; }
.ai-action-info { color: var(--muted); }
.ai-copy-task, .ai-copy-comment {
  padding: 0.1rem 0.5rem;
  border: var(--border);
  border-radius: var(--radius);
  background: #fff;
  font-size: 0.78rem;
  color: var(--muted);
}
.ai-copy-task:hover, .ai-copy-comment:hover { border-color: var(--orange); color: var(--orange); }
.ai-body { margin-top: 0.5rem; }
.ai-body p, .ai-block p { margin: 0.35rem 0; }
.ai-body ul, .ai-block ul { margin: 0.25rem 0 0.25rem 1.2rem; padding: 0; }
.ai-body code, .ai-block code {
  font-family: "Ubuntu Mono", monospace;
  font-size: 0.85em;
  background: #efefef;
  padding: 0.05rem 0.25rem;
  border-radius: var(--radius);
}
.ai-body pre, pre.ai-diff {
  margin: 0.35rem 0;
  padding: 0.5rem 0.65rem;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow-x: auto;
  font-size: 0.82rem;
  line-height: 1.35;
}
.ai-body pre code, pre.ai-diff code { background: none; padding: 0; font-size: inherit; }
.ai-heading { font-weight: 600; margin-top: 0.45rem; }
.ai-block { margin-top: 0.6rem; }
.ai-block-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: var(--muted);
  margin-bottom: 0.2rem;
}
blockquote.ai-comment {
  margin: 0;
  padding: 0.4rem 0.65rem;
  background: #fff;
  border: 1px solid var(--line);
  border-left: 3px solid var(--warm-grey);
  white-space: pre-wrap;
  font-size: 0.88rem;
}
details.ai-phases { margin-top: 0.6rem; font-size: 0.82rem; color: var(--muted); }
details.ai-phases summary { display: inline-block; list-style: none; }
details.ai-phases summary::before { content: "\25b8 "; }
details.ai-phases[open] summary::before { content: "\25be "; }
details.ai-phases summary:hover { color: var(--orange); }
details.ai-phases ul { margin: 0.3rem 0 0 1.2rem; padding: 0; }
.error { color: var(--open); }
footer { padding: 1rem 1.5rem; color: var(--muted); font-size: 0.8rem; }
@media print {
  header { position: static; }
  .controls, .reveal, td:first-child, .ai-copy-task, .ai-copy-comment { display: none; }
}
</style>
</head>
<body>
<header>
  <h1>$title</h1>
  <span class="subtitle">$subtitle</span>
  <div class="controls">
    <span id="left"></span>
    $ai_controls
    <button id="restore-last" class="btn" disabled>Restore last</button>
    <button id="restore-all" class="btn" disabled>Restore all</button>
    <details class="menu" title="Commented items as markdown report, e.g. for Discourse">
      <summary class="btn">Markdown</summary>
      <div class="menu-items">
        <button id="copy-md">📋 Copy</button>
        <button id="save-md">💾 Save</button>
      </div>
    </details>
  </div>
</header>
<main>
$body
</main>
<footer>Generated $generated by <a href="https://github.com/ubuntu/startriage">startriage</a>$ai_footer</footer>
$ai_data<script>
(function () {
  "use strict";
  var PREFIX = "startriage:";
  var MAX_AGE = 31 * 24 * 3600 * 1000;
  var key = PREFIX + "$report_id";
  var stack = [];
  var comments = {};

  function save() {
    try {
      localStorage.setItem(key, JSON.stringify({ time: Date.now(), hidden: stack, comments: comments }));
    } catch (e) {
      // storage unavailable, e.g. disabled for file:// urls
    }
  }

  function load() {
    try {
      for (var i = localStorage.length - 1; i >= 0; i--) {
        var k = localStorage.key(i);
        if (k.indexOf(PREFIX) !== 0 || k === key) continue;
        var entry = JSON.parse(localStorage.getItem(k) || "{}");
        if (!entry.time || Date.now() - entry.time > MAX_AGE) localStorage.removeItem(k);
      }
      return JSON.parse(localStorage.getItem(key) || "{}");
    } catch (e) {
      return {};
    }
  }

  var TEMPLATE = $markdown;

  // The template, reduced to the commented items, each with its comment at the end of its block.
  // Section headings stay only if they contain such an item.
  function markdown() {
    var pending = {};  // url link -> comment
    var labels = {};
    document.querySelectorAll("tbody tr").forEach(function (row) {
      var comment = (comments[row.id] || "").trim();
      if (!comment) return;
      var link = "](" + row.dataset.url + ")";
      pending[link] = comment;
      labels[link] = row.querySelector("td:nth-child(2) a").textContent;
    });

    // blocks: a heading line and the lines up to the next heading
    var blocks = [];
    TEMPLATE.split("\n").forEach(function (line) {
      var match = /^(#+) /.exec(line);
      if (match || !blocks.length) blocks.push({ level: match ? match[1].length : 0, lines: [] });
      blocks[blocks.length - 1].lines.push(line);
    });

    var out = [];
    var headers = [];  // enclosing section headings not yet written
    blocks.forEach(function (block, index) {
      if (index === 0) {
        out = out.concat(block.lines);  // the title
        return;
      }
      var link = Object.keys(pending).find(function (l) { return block.lines[0].includes(l); });
      if (link === undefined && block.level < 4) {
        while (headers.length && headers[headers.length - 1].level >= block.level) headers.pop();
        headers.push(block);
        return;
      }
      if (link === undefined) return;
      headers.forEach(function (header) { out = out.concat(header.lines); });
      headers = [];
      out = out.concat(block.lines.join("\n").trimEnd().split("\n"), "", pending[link], "");
      delete pending[link];
    });

    // commented items the template doesn't have
    Object.keys(pending).forEach(function (link) {
      out.push("", "#### [" + labels[link] + link, "", pending[link], "");
    });
    return out.join("\n").replace(/\n{3,}/g, "\n\n").trim() + "\n";
  }

  function grow(textarea) {
    textarea.style.height = "auto";
    textarea.style.height = textarea.scrollHeight + "px";
  }

  function flash(button, text) {
    var old = button.textContent;
    button.textContent = text;
    setTimeout(function () { button.textContent = old; }, 1500);
  }

  function update() {
    var total = 0;
    document.querySelectorAll("section").forEach(function (section) {
      var visible = section.querySelectorAll("tbody tr:not([hidden])").length;
      section.querySelector(".count").textContent = visible;
      section.classList.toggle("done", visible === 0);
      total += visible;
    });
    document.getElementById("left").textContent = total + " left";
    document.getElementById("restore-last").disabled = stack.length === 0;
    document.getElementById("restore-all").disabled = stack.length === 0;
  }

  function setHidden(id, hidden) {
    var row = document.getElementById(id);
    if (row) row.hidden = hidden;
  }

  document.querySelectorAll("button.check").forEach(function (button) {
    button.addEventListener("click", function () {
      var id = button.closest("tr").id;
      setHidden(id, true);
      stack.push(id);
      save();
      update();
    });
  });

  // A stable sort by the clicked column, so the previous order breaks its ties; empty cells last.
  var collator = new Intl.Collator(undefined, { numeric: true, sensitivity: "base" });
  document.querySelectorAll("button.sort").forEach(function (button) {
    button.addEventListener("click", function () {
      var th = button.closest("th");
      var tbody = th.closest("table").querySelector("tbody");
      var column = Array.prototype.indexOf.call(th.parentNode.children, th);
      var sign = th.getAttribute("aria-sort") === "ascending" ? -1 : 1;
      th.parentNode.querySelectorAll("th").forEach(function (other) { other.removeAttribute("aria-sort"); });
      th.setAttribute("aria-sort", sign > 0 ? "ascending" : "descending");

      function value(row) {
        var cell = row.children[column];
        return cell.dataset.sort !== undefined ? cell.dataset.sort : cell.textContent.trim();
      }
      Array.from(tbody.children)
        .map(function (row) { return { row: row, value: value(row) }; })
        .sort(function (a, b) {
          if (!a.value || !b.value) return !a.value - !b.value;
          return sign * collator.compare(a.value, b.value);
        })
        .forEach(function (entry) { tbody.appendChild(entry.row); });
    });
  });

  // Dragging a header's right edge resizes its column in all sections, as they share one grid.
  // A double click resets the column, a reload all of them.
  var grid = document.querySelector("main");
  var widths = {};  // column index -> px

  function layout(count) {
    var tracks = [];
    for (var i = 0; i < count - 1; i++) tracks.push(widths[i] ? widths[i] + "px" : "var(--column)");
    tracks.push("minmax(0, 1fr)");
    grid.style.gridTemplateColumns = tracks.join(" ");
  }

  document.querySelectorAll("th:not(:last-child) button.sort").forEach(function (button) {
    var th = button.closest("th");
    var count = th.parentNode.children.length;
    var column = Array.prototype.indexOf.call(th.parentNode.children, th);
    var handle = document.createElement("span");
    handle.className = "resize";
    handle.title = "Drag to resize, double click to reset";
    th.appendChild(handle);

    var startX, startWidth;
    handle.addEventListener("pointerdown", function (event) {
      event.preventDefault();
      handle.setPointerCapture(event.pointerId);
      startX = event.clientX;
      startWidth = th.getBoundingClientRect().width;
      grid.classList.add("resizing");
    });
    handle.addEventListener("pointermove", function (event) {
      if (!handle.hasPointerCapture(event.pointerId)) return;
      widths[column] = Math.max(24, Math.round(startWidth + event.clientX - startX));
      layout(count);
    });
    handle.addEventListener("lostpointercapture", function () { grid.classList.remove("resizing"); });
    handle.addEventListener("dblclick", function () {
      delete widths[column];
      layout(count);
    });
  });

  document.getElementById("restore-last").addEventListener("click", function () {
    setHidden(stack.pop(), false);
    save();
    update();
  });

  document.getElementById("restore-all").addEventListener("click", function () {
    stack.forEach(function (id) { setHidden(id, false); });
    stack = [];
    save();
    update();
  });

  var menu = document.querySelector(".menu");
  var menuLabel = menu.querySelector("summary");

  document.addEventListener("click", function (event) {
    if (!menu.contains(event.target)) menu.open = false;
  });

  document.getElementById("copy-md").addEventListener("click", function () {
    menu.open = false;
    navigator.clipboard.writeText(markdown()).then(
      function () { flash(menuLabel, "Copied"); },
      function () { flash(menuLabel, "Copy failed"); }
    );
  });

  document.getElementById("save-md").addEventListener("click", function () {
    menu.open = false;
    var link = document.createElement("a");
    link.href = URL.createObjectURL(new Blob([markdown()], { type: "text/markdown" }));
    link.download = "$filename";
    link.click();
    URL.revokeObjectURL(link.href);
  });

  var saved = load();
  comments = saved.comments || {};

  document.querySelectorAll("textarea.comment").forEach(function (textarea) {
    var row = textarea.closest("tr");
    var id = row.id;

    function show(visible) {
      textarea.hidden = !visible;
      row.classList.toggle("commenting", visible);
      grow(textarea);
    }

    textarea.value = comments[id] || "";
    show(!!textarea.value);
    textarea.addEventListener("input", function () {
      if (textarea.value) comments[id] = textarea.value;
      else delete comments[id];
      grow(textarea);
      save();
    });
    textarea.addEventListener("blur", function () {
      if (!textarea.value) show(false);
    });
    // anywhere on the row but its links, buttons, and AI drawer, unless selecting text
    row.addEventListener("click", function (event) {
      if (event.target.closest("a, button.check, button.ai-toggle, td.ai-cell, textarea")) return;
      if (String(window.getSelection())) return;
      show(true);
      textarea.focus();
    });
  });

  var aiIndex = {};
  try {
    var aiEl = document.getElementById("ai-data");
    var aiParsed = aiEl ? JSON.parse(aiEl.textContent || "null") : null;
    if (aiParsed && Array.isArray(aiParsed.items)) {
      aiParsed.items.forEach(function (item) {
        aiIndex[item.source + "-" + item.key] = {
          schema_version: aiParsed.schema_version || 1,
          item: item
        };
      });
    }
  } catch (e) {
    // ignore malformed embedded data
  }

  function setAiOpen(row, open) {
    var cell = row.querySelector("td.ai-cell");
    var toggle = row.querySelector("button.ai-toggle");
    if (!cell || !toggle) return;
    cell.hidden = !open;
    row.classList.toggle("ai-open", open);
    toggle.setAttribute("aria-expanded", open ? "true" : "false");
  }

  var toggleAllAi = document.getElementById("toggle-all-ai");
  function syncToggleAllAi() {
    if (!toggleAllAi) return;
    var rows = Array.from(document.querySelectorAll("tbody tr:not([hidden])")).filter(function (r) {
      return !!r.querySelector("td.ai-cell");
    });
    var anyClosed = rows.some(function (r) { return r.querySelector("td.ai-cell").hidden; });
    toggleAllAi.textContent = anyClosed ? "Expand AI" : "Collapse AI";
  }

  document.querySelectorAll("button.ai-toggle").forEach(function (button) {
    button.addEventListener("click", function (event) {
      event.stopPropagation();
      var row = button.closest("tr");
      var cell = row.querySelector("td.ai-cell");
      setAiOpen(row, cell.hidden);
      syncToggleAllAi();
    });
  });

  if (toggleAllAi) {
    toggleAllAi.addEventListener("click", function () {
      var open = toggleAllAi.textContent === "Expand AI";
      document.querySelectorAll("tbody tr").forEach(function (row) {
        if (row.querySelector("td.ai-cell")) setAiOpen(row, open);
      });
      syncToggleAllAi();
    });
  }

  document.querySelectorAll("button.ai-copy-comment").forEach(function (button) {
    button.addEventListener("click", function () {
      var text = button.closest(".ai-block").querySelector("blockquote.ai-comment").textContent;
      navigator.clipboard.writeText(text).then(
        function () { flash(button, "Copied"); },
        function () { flash(button, "Copy failed"); }
      );
    });
  });

  document.querySelectorAll("button.ai-copy-task").forEach(function (button) {
    button.addEventListener("click", function () {
      var row = button.closest("tr");
      var payload = aiIndex[row.id];
      if (!payload) return;
      navigator.clipboard.writeText(JSON.stringify(payload, null, 2)).then(
        function () { flash(button, "Copied"); },
        function () { flash(button, "Copy failed"); }
      );
    });
  });

  (saved.hidden || []).forEach(function (id) {
    if (document.getElementById(id)) {
      setHidden(id, true);
      stack.push(id);
    }
  });
  update();
  syncToggleAllAi();
})();
</script>
</body>
</html>
